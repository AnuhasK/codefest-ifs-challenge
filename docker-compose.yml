services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ashen_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ashen_era}
      POSTGRES_USER: ${POSTGRES_USER:-ashen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ashen_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ashen} -d ${POSTGRES_DB:-ashen_era}"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: ashen_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # HTTP Web interface
      - "7687:7687" # Bolt protocol
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-ashen_secret}"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-ashen_secret} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  api:
    build: .
    container_name: ashen_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ashen_era}
      POSTGRES_USER: ${POSTGRES_USER:-ashen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ashen_secret}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-ashen_secret}
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      CORPUS_PATH: /app/Ashen_Era_Archive
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000

  ui:
    build: .
    container_name: ashen_ui
    restart: unless-stopped
    ports:
      - "${UI_PORT:-8501}:8501"
    depends_on:
      - api
    environment:
      API_URL: http://api:8000
    command: streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0

volumes:
  postgres_data:
  neo4j_data:
